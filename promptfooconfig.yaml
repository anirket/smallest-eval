description: "Basic Testing"

providers:
  - 'file://provider.py'

prompts:
  - '{{question}}'

defaultTest:
  assert:
    - type: cost
      threshold: 0.5
    - type: latency
      threshold: 4000

tests:
  - description: joke is funny
    vars:
      question: Tell me a joke
    assert:
      - type: llm-rubric
        threshold: 0.8
        value: Check if response is funny

  - description: simple maths
    vars:
      question: What is 2+2?
      expected: '4'
    assert:
      - type: python
        value: file://checks.py:answer_contains

  - description: capital city
    vars:
      question: What is the capital of France?
      expected: Paris
    assert:
      - type: python
        value: file://checks.py:answer_contains


      